name: snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1f4fbf&color_dots=#ebedf0,#b6d4fe,#6ea8fe,#3a7bff,#1f4fbf
            dist/snake-dark.svg?palette=github-dark&color_snake=#5ff3ff&color_dots=#161b22,#0e3a66,#1f5fa8,#3a7bff,#5ff3ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
